# Sales Channel extension (D17). Registering the app as a Sales Channel is the
# ONLY way to make system-created orders appear under the app's native Channel
# column in Shopify Admin — a custom `source_name` alone does not.
#
# `channel_config` + create_legacy_channel_on_app_install is the proven shape,
# ported verbatim from the PayPlus engine's payplus-installments-channel
# (the CLI rejects the older `sales_channel` type). The handle stays
# `mills-subscriptions` because ShopifyOrderAttribution sets `source_name` to
# exactly that (CLAUDE.md law #11) and the two must match for attribution.
# Deploy with `shopify app deploy`.

[[extensions]]
type = "channel_config"
handle = "mills-subscriptions"
name = "Mills Subscriptions"
create_legacy_channel_on_app_install = true
