# Shopify app manifest (custom distribution, single store).
# Managed with the Shopify CLI: `shopify app deploy`.
# client_id is the app's public API key (same value as SHOPIFY_API_KEY on Railway).
#
# embedded=true + the /admin application_url are what make the app open INSIDE
# Shopify Admin as an iframe. The URL must land directly on the Filament panel:
# the ShopifyEmbedded middleware (CSP frame-ancestors + host/shop param carry)
# only runs on /admin/* — pointing at the site root would drop the embed params
# on the / -> /admin redirect and App Bridge could not initialise.

name = "Mills Subscriptions"
handle = "mills-subscriptions"
client_id = "66449c495ff7545d581ec317a3760d4a"
application_url = "https://mills.lets.co.il/admin"
embedded = true

[access_scopes]
scopes = "read_products,read_orders,write_orders,read_draft_orders,write_draft_orders,read_customers,write_customers"

[auth]
redirect_urls = [
  "https://mills.lets.co.il/shopify/callback",
]

[webhooks]
api_version = "2026-07"

[build]
include_config_on_deploy = true
